

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Youth Peace Central - Member Card</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* =========================
           PAGE BACKGROUND
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            /* CHANGE THIS TO YOUR BACKGROUND */
            background: #dfe3e8;

            font-family: Arial, "Noto Sans Myanmar", sans-serif;
        }


        /* =========================
           CARD
        ========================= */

        .card {
            width: 900px;

            background: white;

            border: 1px solid #cccccc;
            border-radius: 10px;

            overflow: hidden;

            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            position: relative;

            min-height: 145px;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px 100px;

            border-bottom: 1px solid #ddd;

            text-align: center;
        }


        /* =========================
           LOGOS
        ========================= */

        .logo {
            position: absolute;

            width: 120px;
            height: 120px;

            object-fit: contain;
        }

        .logo-left {
            left: 25px;
        }

        .logo-right {
            right: 25px;
        }


        /* =========================
           HEADER TEXT
        ========================= */

        .header-text {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .organization {
            font-size: 23px;
            font-weight: 800;

            letter-spacing: 1px;
        }

        .burmese-name {
            margin-top: 6px;

            font-size: 18px;
            font-weight: 600;
        }

        .card-title {
            margin-top: 12px;

            font-size: 14px;
            color: #666;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .content {
            display: flex;

            gap: 30px;

            padding: 30px;
        }


        /* =========================
           MEMBER PHOTO
        ========================= */

        .photo-section {
            flex-shrink: 0;
        }

        .photo {
            width: 170px;
            height: 210px;

            object-fit: cover;

            border: 1px solid #bbb;
            border-radius: 5px;

            background: #eeeeee;
        }


        /* =========================
           INFORMATION
        ========================= */

        .information {
            flex: 1;
        }

        .id-number {
            margin-bottom: 22px;

            font-size: 16px;
            font-weight: 700;
        }

        .field {
            display: grid;

            grid-template-columns: 110px 1fr;

            margin-bottom: 14px;

            font-size: 15px;
            line-height: 1.5;
        }

        .label {
            font-weight: 700;
        }

        .value {
            color: #333;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            padding: 14px 30px;

            background: #f7f7f7;

            border-top: 1px solid #ddd;

            font-size: 12px;
            color: #888;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .card {
                width: 94%;
            }

            .header {
                padding: 20px 85px;
            }

            .logo {
                width: 60px;
                height: 60px;
            }

            .logo-left {
                left: 40px;
            }

            .logo-right {
                right: 40px;
            }

            .organization {
                font-size: 17px;
            }

            .burmese-name {
                font-size: 14px;
            }

            .content {
                flex-direction: column;
                align-items: center;
            }

            .information {
                width: 100%;
            }

            .field {
                grid-template-columns: 100px 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="card">


        <!-- =========================
             HEADER
        ========================= -->

        <div class="header">

            <!-- LEFT LOGO -->
            <img
                class="logo logo-left"
                src="images/blueandwhitemoonlogo.jpg"
                alt="Left Logo"
            >


            <!-- CENTER TEXT -->

            <div class="header-text">

                <h1 class="organization">
                    YOUTH PEACE CENTRAL
                </h1>

                <p class="burmese-name">
                    လူငယ်ငြိမ်းချမ်းရေးဗဟိုလ် ဌာနချုပ်
                </p>

                <p class="card-title">
                    အဖွဲဝင်စီစစ်ရေးကဒ်ပြား
                </p>

            </div>


            <!-- RIGHT LOGO -->

            <img
                class="logo logo-right"
                src="images/countriesandmyanmar.png"
                alt="Right Logo"
            >

        </div>


        <!-- =========================
             MEMBER INFORMATION
        ========================= -->

        <div class="content">


            <!-- MEMBER PHOTO -->

            <div class="photo-section">

                <img
                    class="photo"
                    src="images/177person.jpg"
                    alt="Member Photo"
                >

            </div>


            <!-- INFORMATION -->

            <div class="information">

                <p class="id-number">
                    ကိုယ်ပိုင်နံပတ် - 177
                </p>


                <div class="field">
                    <span class="label">
                        အမည် -
                    </span>

                    <span class="value">
                        ကောင်းခန့်ဇော်(ခ)စောစိုင်းခန့်
                    </span>
                </div>


                <div class="field">
                    <span class="label">
                        အဖွဲခွဲ -
                    </span>

                    <span class="value">
                        လူငယ့်လက်ရုံး / လူငယ်ကာကွယ်ရေး
                    </span>
                </div>


                <div class="field">
                    <span class="label">
                        ရာထူး -
                    </span>

                    <span class="value">
                        ဗိုလ်ကြီး
                    </span>
                </div>


                <div class="field">
                    <span class="label">
                        တာဝန် -
                    </span>

                    <span class="value">
                        စီးပွါးဆက်ဆံရေးအရာရှိ
                    </span>
                </div>


                <div class="field">
                    <span class="label">
                        ဒေသ -
                    </span>

                    <span class="value">
                        ရန်ကုန်၊ ပဲခူး
                    </span>
                </div>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="footer">
            YOUTH PEACE CENTRAL
        </div>

    </div>

</body>
</html>
